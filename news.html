<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>灰港日报</title><link rel="stylesheet" href="style.css"><body class="site-news"><main class="wrap"><div class="mast">灰港日报</div><article class="article"><div class="eyebrow">城市 / 2017.06.04</div><h1>Harbor Tower 翻修改造进入最后阶段</h1><p><b>记者：Mara Voss</b></p><p>施工方表示，滨水地标的系统更新将在本月结束。工程涉及消防、电力及非公共服务区域；管理方拒绝说明最高层区域的短期封闭是否与旧设备迁移有关。</p><p>在提交截止前，本报记者获悉，北星设施公司曾将一组老旧服务器转运出楼。公司称其“不含租户数据”。</p><p class="note">编辑注：本文网络版本于 2019 年更新。部分原始附件已不再可用。</p><p>相关报道的采访笔记保存在 <a href="mara.html">Mara Voss 档案</a>。</p></article></main></body></html>
