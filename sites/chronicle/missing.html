<main class="page"><h1>17岁学生林逸失踪</h1><p class="meta">2019年10月21日 · 社会</p><div class="article panel">
<p>17岁的林逸于10月17日晚离开家后失踪。警方表示目前没有证据表明存在第三方介入。</p>
<p>其父亲林伟称，林逸最近“对一栋建筑产生了不健康的兴趣”。</p>
<p>警方最后一次确认的手机活动地点接近Harbor Tower。</p></div>
