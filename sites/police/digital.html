<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GPD · DIGITAL EVIDENCE PORTAL</title><link rel="stylesheet" href="../../assets/style.css"></head><body class="police portal-page"><header class="sitebar"><div class="wrap bar"><a class="logo" href="index.html" style="text-decoration:none">GPD / DIGITAL EVIDENCE</a><nav class="nav"><a href="case.html">案件记录</a><a href="../../index.html">返回调查</a></nav></div></header><main><div class="portal-card"><div class="eyebrow">AUTHORIZED ACCESS ONLY</div><h1 class="title">Digital Evidence Portal</h1><p class="subtitle">关联案件：GH-MP-2019-1017-17</p><form id="portalForm" class="portal-form"><label>Username<input id="user" autocomplete="off"></label><label>Password<input id="pass" type="password" autocomplete="off"></label><button class="btn primary" type="submit">Authenticate</button></form><p id="portalError" class="login-error" hidden>认证失败。</p><div id="portalData" hidden class="panel portal-data"><div class="meta">RECOVERED WEB RECORD</div><h2>Evan Lin / Private Records</h2><p>关联站点：EVAN LIN PERSONAL</p><p>恢复的记录显示该账户在失踪前仍有本地笔记同步。</p><div class="actions"><a class="btn" href="../../sites/evan/notes.html">打开恢复的私人记录 →</a></div></div></div></main><footer><div class="wrap">GPD DIGITAL EVIDENCE SYSTEM · Fictional game site</div></footer><script>const U='elin.archive',H='05e3fc3cabbfd70dc64a0b8c09ffc84f6a807782ba6cc4c5fceb1e38e1e48b69';async function digest(s){const b=new TextEncoder().encode(s),h=await crypto.subtle.digest('SHA-256',b);return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}document.getElementById('portalForm').addEventListener('submit',async e=>{e.preventDefault();const u=document.getElementById('user').value.trim(),p=document.getElementById('pass').value;if(u===U&&await digest(p)===H){document.getElementById('portalData').hidden=false;document.getElementById('portalError').hidden=true;sessionStorage.setItem('portal
