<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>警察局 · 数字证据</title><link rel="stylesheet" href="../../assets/style.css"></head><body class="police portal-page">
<header class="sitebar"><div class="wrap bar"><a class="logo" href="index.html" style="text-decoration:none">数字证据系统</a><nav class="nav"><a href="case.html">案件记录</a><a href="../../index.html">返回调查</a></nav></div></header>
<main><div class="portal-card"><div class="eyebrow">受限系统</div><h1 class="title">数字证据</h1><p class="subtitle">关联案件：GH-MP-2019-1017-17</p>
<form id="portalForm" class="portal-form"><label>用户名<input id="user" autocomplete="off"></label><label>密码<input id="pass" type="password" autocomplete="off"></label><button class="btn primary" type="submit">登录</button></form>
<p id="portalError" class="login-error" hidden>用户名或密码不正确。</p>
<div id="portalData" hidden class="panel portal-data"><div class="meta">恢复的网站记录</div><h2>林逸 / 私人记录</h2><p>关联网站：林逸个人网站</p><p>恢复的记录显示，该账户在失踪前仍有本地笔记同步。</p><div class="actions"><a class="btn" href="../../sites/evan/notes.html">打开私人记录 →</a></div></div>
</div></main><footer><div class="wrap">灰港市警察局 · 数字证据系统 · 虚构网站</div></footer>
<script>
const U='elin.archive',H='33551b7de51d8942b0ff52729ccbaf5f682636c1de8086a28c5beb134f9b0aaf';
async function digest(s){const b=new TextEncoder().encode(s);const h=await crypto.subtle.digest('SHA-256',b);return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}
document.getElementById('portalForm').addEventListener('submit',async e=>{e.preventDefault();const u=document.getElementById('user').value.trim(),p=document.getElementById('pass').value.replace(/\s+/g,'');if(u===U&&await digest(p.toLowerCase())===H){document.getElementById('portalData').hidden=false;document.getElementById('portalError').hidden=true;sessionStorage.setItem('portal','1')}else document.getElementById('portalError').hidden=false});
if(sessionStorage.getItem('portal')==='1')document.getElementById('portalData').hidden=false;
</script></body></html>
