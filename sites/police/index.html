<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>灰港市警察局 · 公开档案</title><link rel="stylesheet" href="../../assets/style.css"></head>
<body class="police"><header class="sitebar"><div class="wrap bar"><a class="logo" href="index.html" style="text-decoration:none">灰港市警察局</a><nav class="nav"><a href="index.html">首页</a><a href="records.html">公开档案</a><a href="../../index.html">返回调查</a></nav></div></header>
<main><section class="police-head"><div class="eyebrow">灰港市警察局 · 公开档案系统</div><h1 class="title">档案检索</h1><p class="subtitle">公开档案需要完整的档案编号。</p></section>
<section class="police-terminal panel"><div class="meta">档案检索 / 案件编号</div><form id="policeSearch" class="police-search"><label>档案编号<input id="caseNo" autocomplete="off" placeholder="输入完整编号"></label><button class="btn primary" type="submit">检索</button></form><div id="policeResult" class="police-result"></div></section>
<section class="police-notice"><div><span class="meta">公开范围</span><p>公开页面只保留索引信息。调查材料、通讯记录和数字证据不在公开档案中。</p></div><div class="seal">GPD<br><small>1908</small></div></section>
</main><footer><div class="wrap">灰港市警察局 · 公开档案 · 虚构网站</div></footer>
<script>
const target='GH-MP-2019-1017-17';
document.getElementById('policeSearch').addEventListener('submit',e=>{e.preventDefault();const q=document.getElementById('caseNo').value.trim().toUpperCase(),r=document.getElementById('policeResult');
if(q===target){r.innerHTML='<div class="record-found"><div class="meta">已找到档案</div><h2>失踪人口</h2><dl><div><dt>编号</dt><dd>'+target+'</dd></div><div><dt>立案日期</dt><dd>2019-10-17</dd></div><div><dt>状态</dt><dd>未结案</dd></div><div><dt>公开范围</dt><dd>仅索引</dd></div></dl><p class="restricted-line">其余材料受到限制。</p><a class="btn" href="case.html">查看公开记录 →</a></div>'}
else r.innerHTML='<div class="record-empty"><span class="meta">没有结果</span><p>没有找到对应的公开档案。</p></div>'});
</script></body></html>
