<main><div class="eyebrow">私人记录</div><h1 class="title">本地记录</h1>
<div id="gate" class="login-panel panel"><div class="meta">需要登录</div><p>这部分内容没有公开。</p><form id="loginForm" class="login-form"><label for="user">用户名<input id="user" autocomplete="off"></label><label for="pw">密码<input id="pw" type="password" autocomplete="off"></label><button class="btn primary" type="submit">登录</button></form><p id="error" class="login-error" hidden>用户名或密码不正确。</p></div>
<article id="secret" class="panel secret" hidden><div class="meta">本地记录 · 2019年10月</div><h2>10 / 17</h2><p>今晚不要带相机包。只带一台小机身。</p><p>如果门还是开着，我从<strong class="clue">服务楼梯</strong>上去。</p><p>最后一张照片还留在公开页面里。</p><p class="meta">— E</p></article>
</main><footer><div class="wrap">林逸个人网站 · 私人记录</div></footer>
<script>
const USER='elin.archive', HASH='33551b7de51d8942b0ff52729ccbaf5f682636c1de8086a28c5beb134f9b0aaf';
async function digest(s){const b=new TextEncoder().encode(s);const h=await crypto.subtle.digest('SHA-256',b);return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('');}
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const u=document.getElementById('user').value.trim();const p=document.getElementById('pw').value.replace(/\s+/g,'');const ok=await digest(p.toLowerCase())===HASH.toLowerCase();if(u===USER&&ok){document.getElementById('gate').hidden=true;document.getElementById('secret').hidden=false;sessionStorage.setItem('notesUnlocked','1')}else document.getElementById('error').hidden=false;});
if(sessionStorage.getItem('notesUnlocked')==='1'){document.getElementById('gate').hidden=true;document.getElementById('secret').hidden=false;}
</script></body></html>
